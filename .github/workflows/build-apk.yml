name: Build Far Cry 2 APK

on:
  workflow_dispatch:      # lets you press a "Run workflow" button
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get this repo (profile + patches)
        uses: actions/checkout@v4

      - name: Get Winlator app source (pinned version)
        run: |
          git clone https://github.com/brunodev85/winlator-app.git winlator-app
          cd winlator-app
          git checkout 8077f374ef2d54127b088de9e8cd7b4af14d9c8b

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake the project needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Add the Far Cry 2 touch-control profile and app name
        run: |
          cp fc2_profile/controls-5.icp winlator-app/app/src/main/assets/inputcontrols/profiles/controls-5.icp
          # Only the visible label changes. The package name MUST stay com.winlator
          # because the bundled Linux system image has that path baked in.
          sed -i 's|<string name="app_name">Winlator</string>|<string name="app_name">Far Cry 2</string>|' \
            winlator-app/app/src/main/res/values/strings.xml
          echo "android.suppressUnsupportedCompileSdk=35" >> winlator-app/gradle.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: winlator-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: FarCry2-apk
          path: winlator-app/app/build/outputs/apk/debug/*.apk
